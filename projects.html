<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects - MosesHang</title>
  <style>
    /* --- Reset & Core Styles --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    :root {
      --bg-color: #03030c;
      --text-color: #ffffff;
      --text-muted: #8a99ad;
      --accent-color: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.4);
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    #starlink-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 1.5rem 10%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(3, 3, 12, 0.8), transparent);
      backdrop-filter: blur(5px);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-color);
      text-decoration: none;
    }

    .logo span {
      color: var(--accent-color);
      text-shadow: 0 0 10px var(--accent-glow);
    }

    nav {
      display: flex;
      align-items: center;
    }

    .nav-links {
      display: flex;
      align-items: center;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 2rem;
      font-size: 0.9rem;
      letter-spacing: 1px;
      transition: color 0.3s, text-shadow 0.3s;
    }

    .nav-links a:hover,
    .nav-links a[aria-current='page'] {
      color: var(--accent-color);
      text-shadow: 0 0 8px var(--accent-glow);
    }

    .lang-btn {
      margin-left: 2rem;
      padding: 0.4rem 0.8rem;
      border: 1px solid var(--accent-color);
      background: rgba(0, 242, 254, 0.1);
      color: var(--accent-color);
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .lang-btn:hover {
      background: var(--accent-color);
      color: #03030c;
    }

    /* 三點菜單按鈕（預設電腦版隱藏） */
    .menu-toggle {
      display: none;
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--accent-color);
      font-size: 1.5rem;
      padding: 0.2rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .menu-toggle:hover {
      border-color: var(--accent-color);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    section {
      min-height: 100vh;
      padding: 8rem 10% 4rem 10%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .section-title {
      font-size: 2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 2rem;
      position: relative;
      display: inline-block;
    }

    .section-title::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 0;
      width: 50px;
      height: 2px;
      background-color: var(--accent-color);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .filter-container {
      display: flex;
      gap: 1rem;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.6rem 1.5rem;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-muted);
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      letter-spacing: 1px;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }

    .filter-btn:hover,
    .filter-btn.active {
      color: var(--text-color);
      border-color: var(--accent-color);
      background: rgba(0, 242, 254, 0.1);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      width: 100%;
    }

    .project-card {
      background: transparent;
      perspective: 1000px;
      min-height: 360px;
    }

    .project-card.hidden {
      display: none;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }

    .project-card:hover .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front,
    .flip-card-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 8px;
      padding: 2rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .project-card:hover .flip-card-front,
    .project-card:hover .flip-card-back {
      border-color: var(--accent-color);
      box-shadow: 0 10px 30px rgba(0, 242, 254, 0.1);
    }

    .flip-card-front {
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .flip-card-front h3 {
      font-size: 1.8rem;
      letter-spacing: 0.5px;
      color: var(--text-color);
    }

    .flip-card-front p {
      color: var(--accent-color);
      font-size: 0.9rem;
      margin-top: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.8;
    }

    .flip-card-back {
      transform: rotateY(180deg);
      justify-content: flex-start;
    }

    .flip-card-back h3 {
      margin-bottom: 1rem;
      font-size: 1.4rem;
      letter-spacing: 0.5px;
    }

    .flip-card-back p {
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      flex-grow: 1;
    }

    .project-link {
      color: var(--accent-color);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      margin-top: auto;
    }

    .project-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(3, 3, 12, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #0a0d1d;
      border: 1px solid var(--accent-color);
      box-shadow: 0 0 25px var(--accent-glow);
      border-radius: 12px;
      width: 90%;
      max-width: 800px;
      padding: 2rem;
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.8rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: var(--accent-color);
    }

    .modal-left {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      min-height: 250px;
    }

    .modal-left img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-right {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .modal-top-text h3 {
      font-size: 1.6rem;
      margin-bottom: 0.8rem;
      color: var(--text-color);
    }

    .modal-top-text p {
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .modal-bottom-link {
      display: flex;
      justify-content: flex-end;
      margin-top: 1.5rem;
    }

    .modal-btn {
      padding: 0.6rem 1.2rem;
      background: var(--accent-color);
      color: #03030c;
      font-weight: 700;
      text-decoration: none;
      border-radius: 4px;
      box-shadow: 0 0 10px var(--accent-glow);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .modal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 15px var(--accent-color);
    }

    /* --- 手機版 RWD 樣式調整 --- */
    @media (max-width: 768px) {
      header {
        padding: 1.2rem 5%;
      }

      section {
        padding: 6rem 5% 3rem 5%;
      }

      /* 顯示三點按鈕 */
      .menu-toggle {
        display: block;
      }

      /* 將選單改為彈出式選單 */
      .nav-links {
        position: absolute;
        top: 100%;
        right: 5%;
        width: 200px;
        background: rgba(3, 3, 12, 0.95);
        border: 1px solid var(--accent-color);
        box-shadow: 0 10px 25px rgba(0, 242, 254, 0.2);
        backdrop-filter: blur(10px);
        border-radius: 8px;
        flex-direction: column;
        align-items: flex-start;
        padding: 1rem 0;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: all 0.3s ease;
      }

      /* 點擊三點按鈕後顯示選單 */
      .nav-links.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .nav-links a {
        margin: 0;
        padding: 0.8rem 1.5rem;
        width: 100%;
        font-size: 0.95rem;
      }

      .lang-btn {
        margin: 0.5rem 1.5rem 0.5rem 1.5rem;
        width: calc(100% - 3rem);
        text-align: center;
      }

      .modal-box {
        grid-template-columns: 1fr;
        max-height: 90vh;
        overflow-y: auto;
      }
    }
  </style>
</head>

        </div>

    // 點擊三點按鈕切換選單顯示/隱藏
    menuToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      navLinks.classList.toggle('active');
    });

    // 點擊選單項目後自動關閉選單
    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        navLinks.classList.remove('active');
      });
    });

    // 點擊頁面其他地方關閉選單
    document.addEventListener('click', (e) => {
      if (!navLinks.contains(e.target) && !menuToggle.contains(e.target)) {
        navLinks.classList.remove('active');
      }

        img: '/image/kennedyislandresort.jpg',
        url: 'https://maps.app.goo.gl/hqoyn3pBrFyCW6HEA',

        }
      },
      {
        category: 'web',
        title: { en: 'Adventurer Form', zh: '冒險者表格 (Adventurer Form)' },
        subtitle: { en: 'My ICT first project.', zh: '我的第一個 ICT 網頁項目。' },
        img: '/image/adv.jpg',
        url: 'web1.html',
        description: {
          en: '2024/12/20 #freecodecamp<br /><br />For the first ICT project, I researched the implementation process independently, consulted the teacher for guidance, and successfully learned HTML & CSS.',

      {

        subtitle: { en: 'Introduce YOASOBI.', zh: '介紹日本音樂組合 YOASOBI。' },
        img: '/image/YOA.jpg',
        url: 'web2.html',
        description: {

          zh: '2025/08/01 #freecodecamp<br /><br />第二個 ICT 項目，為日本音樂組合 YOASOBI 製作個人介紹網頁。'

        url: 'web3.html',

          zh: '2025/04/30 #freecodecamp<br /><br />第三個 ICT 項目，介紹精靈寶可夢動畫的歷史演變。'

      }
    ];

    let currentLang = localStorage.getItem('site_lang') || 'en';
    const gridContainer = document.getElementById('projects-grid');

    function renderProjects() {
      const viewText = translations[currentLang].viewTerminal;
      gridContainer.innerHTML = projectsData.map((p, index) => `
        <div class="project-card" data-category="${p.category}" data-index="${index}">
          <div class="flip-card-inner">
            <div class="flip-card-front">
              <h3>${p.title[currentLang]}</h3>
              <p>${p.subtitle[currentLang]}</p>
            </div>
            <div class="flip-card-back">
              <h3>${p.title[currentLang]}</h3>
              <p>${p.description[currentLang]}</p>
              <a class="project-link">${viewText}</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    function updateLanguage() {
      const langData = translations[currentLang];
      document.getElementById('lang-btn').innerText = langData.langBtn;

      document.querySelectorAll('.lang-text').forEach(el => {
        const key = el.getAttribute('data-key');
        if (langData[key]) {
          el.innerHTML = langData[key];
        }
      });

      renderProjects();
    }

    document.getElementById('lang-btn').addEventListener('click', () => {
      currentLang = currentLang === 'en' ? 'zh' : 'en';
      localStorage.setItem('site_lang', currentLang);
      updateLanguage();
    });

    renderProjects();
    updateLanguage();

    /* --- Filter Logic --- */
    const filterBtns = document.querySelectorAll('.filter-btn');
    filterBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        filterBtns.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');

        const filterValue = btn.getAttribute('data-filter');
        document.querySelectorAll('.project-card').forEach((card) => {
          const category = card.getAttribute('data-category');
          if (filterValue === 'all' || filterValue === category) {
            card.classList.remove('hidden');
          } else {
            card.classList.add('hidden');
          }
        });
      });
    });

    /* --- Modal Logic --- */
    const modal = document.getElementById('project-modal');
    const modalClose = document.getElementById('modal-close');
    const modalImg = document.getElementById('modal-img');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const modalLink = document.getElementById('modal-link');

    gridContainer.addEventListener('click', (e) => {
      const link = e.target.closest('.project-link');
      if (!link) return;

      e.preventDefault();
      const card = link.closest('.project-card');
      const index = card.getAttribute('data-index');
      const data = projectsData[index];

      modalTitle.innerText = data.title[currentLang];
      modalDesc.innerHTML = data.description[currentLang];
      modalImg.src = data.img;
      modalLink.href = data.url;

      modal.classList.add('active');
    });

    modalClose.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });

    /* --- Canvas Animation --- */
    const canvas = document.getElementById('starlink-canvas');
    const ctx = canvas.getContext('2d');
    let resizeTimeout;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(resizeCanvas, 150);
    });
    resizeCanvas();

    const stars = [];
    const numStars = 100;
    const connectionDistance = 120;

    class Star {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
        this.radius = Math.random() * 1.5 + 0.5;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;
        if (this.y < 0) this.y = canvas.height;
        if (this.y > canvas.height) this.y = 0;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.fill();
      }
    }

    for (let i = 0; i < numStars; i++) stars.push(new Star());

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach((star) => { star.update(); star.draw(); });

      for (let i = 0; i < stars.length; i++) {
        for (let j = i + 1; j < stars.length; j++) {
          const dx = stars[i].x - stars[j].x;
          const dy = stars[i].y - stars[j].y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < connectionDistance) {
            const opacity = 1 - distance / connectionDistance;
            ctx.beginPath();
            ctx.moveTo(stars[i].x, stars[i].y);
            ctx.lineTo(stars[j].x, stars[j].y);
            ctx.strokeStyle = `rgba(0, 242, 254, ${opacity * 0.15})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
