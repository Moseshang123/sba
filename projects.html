<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects - MosesHang</title>
  <style>
    /* --- Reset & Core Styles --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    :root {
      --bg-color: #03030c;
      --text-color: #ffffff;
      --text-muted: #8a99ad;
      --accent-color: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.4);
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    #starlink-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 1.5rem 10%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(3, 3, 12, 0.8), transparent);
      backdrop-filter: blur(5px);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-color);
      text-decoration: none;
    }

    .logo span {
      color: var(--accent-color);
      text-shadow: 0 0 10px var(--accent-glow);
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 2rem;
      font-size: 0.9rem;
      letter-spacing: 1px;
      transition: color 0.3s, text-shadow 0.3s;
    }

    nav a:hover,
    nav a[aria-current='page'] {
      color: var(--accent-color);
      text-shadow: 0 0 8px var(--accent-glow);
    }

    section {
      min-height: 100vh;
      padding: 8rem 10% 4rem 10%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .section-title {
      font-size: 2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 2rem;
      position: relative;
      display: inline-block;
    }

    .section-title::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 0;
      width: 50px;
      height: 2px;
      background-color: var(--accent-color);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .filter-container {
      display: flex;
      gap: 1rem;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.6rem 1.5rem;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-muted);
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      letter-spacing: 1px;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }

    .filter-btn:hover,
    .filter-btn.active {
      color: var(--text-color);
      border-color: var(--accent-color);
      background: rgba(0, 242, 254, 0.1);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      width: 100%;
    }

    .project-card {
      background: transparent;
      perspective: 1000px;
      min-height: 360px;
    }

    .project-card.hidden {
      display: none;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }

    .project-card:hover .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front,
    .flip-card-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 8px;
      padding: 2rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .project-card:hover .flip-card-front,
    .project-card:hover .flip-card-back {
      border-color: var(--accent-color);
      box-shadow: 0 10px 30px rgba(0, 242, 254, 0.1);
    }

    .flip-card-front {
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .flip-card-front h3 {
      font-size: 1.8rem;
      letter-spacing: 0.5px;
      color: var(--text-color);
    }

    .flip-card-front p {
      color: var(--accent-color);
      font-size: 0.9rem;
      margin-top: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.8;
    }

    .flip-card-back {
      transform: rotateY(180deg);
      justify-content: flex-start;
    }

    .flip-card-back h3 {
      margin-bottom: 1rem;
      font-size: 1.4rem;
      letter-spacing: 0.5px;
    }

    .flip-card-back p {
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      flex-grow: 1;
    }

    .project-link {
      color: var(--accent-color);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      margin-top: auto;
    }

    .project-link:hover {
      text-decoration: underline;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(3, 3, 12, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #0a0d1d;
      border: 1px solid var(--accent-color);
      box-shadow: 0 0 25px var(--accent-glow);
      border-radius: 12px;
      width: 90%;
      max-width: 800px;
      padding: 2rem;
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.8rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: var(--accent-color);
    }

    .modal-left {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      min-height: 250px;
    }

    .modal-left img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-right {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .modal-top-text h3 {
      font-size: 1.6rem;
      margin-bottom: 0.8rem;
      color: var(--text-color);
    }

    .modal-top-text p {
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .modal-bottom-link {
      display: flex;
      justify-content: flex-end;
      margin-top: 1.5rem;
    }

    .modal-btn {
      padding: 0.6rem 1.2rem;
      background: var(--accent-color);
      color: #03030c;
      font-weight: 700;
      text-decoration: none;
      border-radius: 4px;
      box-shadow: 0 0 10px var(--accent-glow);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .modal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 15px var(--accent-color);
    }

    @media (max-width: 768px) {
      header { padding: 1.5rem 5%; }
      section { padding: 6rem 5% 3rem 5%; }
      nav a { margin-left: 1rem; font-size: 0.8rem; }
      .modal-box { grid-template-columns: 1fr; max-height: 90vh; overflow-y: auto; }
    }
  </style>
</head>

<body>
  <canvas id="starlink-canvas"></canvas>

  <header>
    <a href="index.html" class="logo">Moses<span>Hang</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="projects.html" aria-current="page">Projects</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="projects">
      <h2 class="section-title">MosesHang's Projects</h2>

      <div class="filter-container">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="game">Game</button>
        <button class="filter-btn" data-filter="art">Art</button>
        <button class="filter-btn" data-filter="challenge">Challenge</button>
        <button class="filter-btn" data-filter="web">Web</button>
      </div>

      <!-- 動態載入專案容器 -->
      <div class="projects-grid" id="projects-grid"></div>
    </section>
  </main>

  <div class="modal-overlay" id="project-modal">
    <div class="modal-box">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="modal-left">
        <img id="modal-img" src="" alt="Project Image" />
      </div>
      <div class="modal-right">
        <div class="modal-top-text">
          <h3 id="modal-title">Project Title</h3>
          <p id="modal-desc">Project Description...</p>
        </div>
        <div class="modal-bottom-link">
          <a id="modal-link" href="#" target="_blank" class="modal-btn">Visit Project &rarr;</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* --- 1. 專案資料集 (將所有重複的卡片集中統一管理) --- */
    const projectsData = [
      {
        category: 'game',
        title: 'Ninja Jump Jump Jump',
        subtitle: '2D side-scrolling running game.',
        img: '/image/ninja jump.jpg',
        url: 'https://www.roblox.com/games/17327498297/Ninja-Jump-Jump-Jump',
        description: '2024/04/29 #Roblox<br /><br />This is a 2D reaction-based game where you play as a ninja who is constantly running forward. You need to dodge traps, lasers, zombies, and other obstacles. The game has no end and is designed for you to play and relax.'
      },
      {
        category: 'game',
        title: 'Find the button',
        subtitle: 'My first attempt at using code in a game.',
        img: '/image/findbutton.jpg',
        url: 'https://www.roblox.com/games/113089498204682/find-the-button',
        description: '2025/04/28 #Roblox<br /><br />This is a game that tests your keen eye and powers of observation. You must use your sharp eyes to locate the button that leads to the next level, but be careful to avoid the trap buttons that send you back to the start.'
      },
      {
        category: 'game',
        title: 'Toliet obby',
        subtitle: 'My first game',
        img: '/image/toliet obby.jpg',
        url: 'https://www.roblox.com/games/14682074026/Toilet-Obby',
        description: '2023/09/04 #Roblox<br /><br />Toilet obby is called toilet parkour. It is basically the same as other parkour games. However, toilet obby has a special feature. It does not get harder as you go. It is simple and difficult and simple and difficult. So it is a very special and strange parkour game. I hope you have fun and enjoy Toilet obby.'
      },
      {
        category: 'game',
        title: 'Eternal Runner',
        subtitle: '3D stereo third person rear end collision perspective.',
        img: '/image/Eternal Runner.jpg',
        url: 'https://www.roblox.com/games/91712186081698/Eternal-Runner',
        description: '2025/09/14 #Roblox<br /><br />Eternal Runner is a fast-paced parkour game where players must navigate their character through obstacles and traps. The challenge intensifies as the speed increases! Put your reflexes to the test and set a new record!'
      },
      {
        category: 'game',
        title: 'U Need Transcends',
        subtitle: "use code to make's game teamwork with brian yu.",
        img: '/image/uneedtranscends.jpg',
        url: 'https://www.roblox.com/games/128635892484371/Untitled-Experience',
        description: "2026/04/29 #Roblox<br /><br />This game demands immense mental effort and patience, as it is an [obby] game designed to mess with your head."
      },
      {
        category: 'game',
        title: 'Tsunami! Run!',
        subtitle: "Aligns with the HKSC 20th anniversary theme: [Swimming Against the Current]",
        img: '/image/Tsunami.jpg',
        url: 'https://www.roblox.com/games/128478871170904/SGS-MoseHungs-Place-02242026-4',
        description: "2026/04/30 #Roblox<br /><br />Tsunami! Run! It is a game of avoiding waves. You need to get into the cave before the flood comes over to avoid the flood, challenging the thrill of reaction! "
      },
      {
        category: 'art',
        title: 'Cursed blue-face car crash painting',
        subtitle: 'A work composed of various elements from different magazines.',
        img: '/image/Cursed blue-face car.jpg',
        description: '2023/11/21 #Drawing<br /><br />A project created during the third year of junior high school, in which a story was composed by combining photographic elements from various magazines.'
      },
      {
        category: 'art',
        title: 'Old Summer Palace have summer break',
        subtitle: 'Work created in history',
        img: '/image/summer.jpg',
        url: 'https://youtube.com/watch?v=MI0JnWLcRHQ&si=0f1nk-MxmmmO1maD',
        description: '2024/07/30 #Sandbox<br /><br />petition recommended by our teacher. We chose the "Burning of the Old Summer Palace"—a historical event defined by raging flames—as our project theme and created a corresponding project along with a demonstration video.'
      },
      {
        category: 'challenge',
        title: 'Kennedy Town🚶‍♂️‍➡️island Resort',
        subtitle: 'Challenge yourself by walking through Hong Kong.',
        img: '/image/kennedyislandresort.jpg',
        url: 'https://maps.app.goo.gl/hqoyn3pBrFyCW6HEA',
        description: '2026/08/07 #Walking<br /><br />During the holiday, I applied the "sandbox" skills learned in class to participate in a competition. I chose "The Burning of the Old Summer Palace" as the project theme and created both the project itself and a corresponding demonstration video.'
      },
      {
        category: 'web',
        title: 'Adventurer Form',
        subtitle: 'My ICT first project.',
        img: '/image/adv.jpg',
        url: 'web1.html',
        description: '2024/12/20 #freecodecamp<br /><br />My ICT first project'
      },
      {
        category: 'web',
        title: 'YOASOBI introduce',
        subtitle: 'Introduce YOASOBI.',
        img: '/image/YOA.jpg',
        url: 'web2.html',
        description: '2025/08/01 #freecodecamp<br /><br />Introduce YOASOBI'
      },
      {
        category: 'web',
        title: 'Pokemon history',
        subtitle: 'Introduce pokemon history of animation.',
        img: '/image/pkmon.jpg',
        url: 'web3.html',
        description: '2025/04/30 #freecodecamp<br /><br />Introduce pokemon history of animation'
      }
    ];

    /* --- 2. 動態渲染卡片 --- */
    const gridContainer = document.getElementById('projects-grid');

    function renderProjects() {
      gridContainer.innerHTML = projectsData.map((p, index) => `
        <div class="project-card" data-category="${p.category}" data-index="${index}">
          <div class="flip-card-inner">
            <div class="flip-card-front">
              <h3>${p.title}</h3>
              <p>${p.subtitle}</p>
            </div>
            <div class="flip-card-back">
              <h3>${p.title}</h3>
              <p>${p.description}</p>
              <a class="project-link">View Terminal &rarr;</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    renderProjects();

    /* --- 3. Starlink 背景動畫 --- */
    const canvas = document.getElementById('starlink-canvas');
    const ctx = canvas.getContext('2d');
    let resizeTimeout;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(resizeCanvas, 150);
    });
    resizeCanvas();

    const stars = [];
    const numStars = 100;
    const connectionDistance = 120;

    class Star {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
        this.radius = Math.random() * 1.5 + 0.5;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;
        if (this.y < 0) this.y = canvas.height;
        if (this.y > canvas.height) this.y = 0;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.fill();
      }
    }

    for (let i = 0; i < numStars; i++) stars.push(new Star());

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach((star) => { star.update(); star.draw(); });

      for (let i = 0; i < stars.length; i++) {
        for (let j = i + 1; j < stars.length; j++) {
          const dx = stars[i].x - stars[j].x;
          const dy = stars[i].y - stars[j].y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < connectionDistance) {
            const opacity = 1 - distance / connectionDistance;
            ctx.beginPath();
            ctx.moveTo(stars[i].x, stars[i].y);
            ctx.lineTo(stars[j].x, stars[j].y);
            ctx.strokeStyle = `rgba(0, 242, 254, ${opacity * 0.15})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animate);
    }
    animate();

    /* --- 4. 分類篩選邏輯 --- */
    const filterBtns = document.querySelectorAll('.filter-btn');
    filterBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        filterBtns.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');

        const filterValue = btn.getAttribute('data-filter');
        document.querySelectorAll('.project-card').forEach((card) => {
          const category = card.getAttribute('data-category');
          if (filterValue === 'all' || filterValue === category) {
            card.classList.remove('hidden');
          } else {
            card.classList.add('hidden');
          }
        });
      });
    });

    /* --- 5. Modal 彈出視窗邏輯 --- */
    const modal = document.getElementById('project-modal');
    const modalClose = document.getElementById('modal-close');
    const modalImg = document.getElementById('modal-img');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const modalLink = document.getElementById('modal-link');

    gridContainer.addEventListener('click', (e) => {
      const link = e.target.closest('.project-link');
      if (!link) return;

      e.preventDefault();
      const card = link.closest('.project-card');
      const index = card.getAttribute('data-index');
      const data = projectsData[index];

      modalTitle.innerText = data.title;
      modalDesc.innerHTML = data.description;
      modalImg.src = data.img;
      modalLink.href = data.url;

      modal.classList.add('active');
    });

    modalClose.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });
  </script>
</body>

</html>
